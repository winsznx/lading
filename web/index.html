<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Lading plans which produce goes where, when, and at what price, so less of it rots."
    />
    <meta name="color-scheme" content="light dark" />
    <title>Lading planner</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231c1c1a'/%3E%3Cpath d='M5 3.5v9h6' stroke='%23fafaf8' stroke-width='2' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      try {
        var stored = window.localStorage.getItem("lading-theme");
        if (stored === "light" || stored === "dark") document.documentElement.dataset.theme = stored;
      } catch (error) {
        console.warn("Theme preference unavailable, following the system theme.", error);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
