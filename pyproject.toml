[project]
name = "lading"
version = "1.0.0"
description = "Dispatch planner for a produce hub: which batch goes where, when, and at what price, so less of it rots."
requires-python = ">=3.11,<3.12"
dependencies = [
    "highspy==1.11.0",
    "numpy==2.2.6",
    "pydantic==2.11.7",
    "jsonschema==4.24.0",
    "fastapi==0.115.14",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "httpx==0.28.1",
    "ruff==0.12.3",
    "mypy==1.16.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["web", "internal", ".venv", "node_modules", "results", "data", "deploy", ".git"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web", "internal", "film"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["web/", "internal/", "film/"]
